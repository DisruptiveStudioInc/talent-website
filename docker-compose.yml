services:
  disruptive-studio-website:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3874:80"
    volumes:
      - ./:/var/www/html
      - ./vendor:/var/www/html/vendor
    environment:
      APP_ENV: dev

  composer:
    image: composer:2
    working_dir: /app
    volumes:
      - ./:/app
      - ./vendor:/app/vendor
      - composer-cache:/tmp
    entrypoint: ["composer"]
    command: ["install", "--no-interaction", "--prefer-dist"]
    profiles: ["tools"]

volumes:
  composer-cache:
